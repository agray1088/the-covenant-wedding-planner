# Optional local Postgres + host proxy + sync API + browser pgAdmin (beta).
# Offline planner does not need this — only the sync API does.
#
# LOCAL DEV ONLY — not for production.
#
# Desktop pgAdmin / host Node → 127.0.0.1:5433 → pgbouncer (auth_type=any + forced user)
#   → postgres on the Docker network (trust). This avoids Docker Desktop on
#   Windows breaking SCRAM password auth through published Postgres ports.
# Browser pgAdmin (:5050) and the api service talk to hostname `postgres` directly.
services:
  postgres:
    build:
      context: ./server
      dockerfile: Dockerfile.postgres
    image: covenant-postgres:local
    container_name: covenant-postgres
    environment:
      POSTGRES_USER: covenant
      POSTGRES_PASSWORD: covenant
      POSTGRES_DB: covenant
      # Local wedding-planner Docker Desktop only — never ship trust to production.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    # Not published to the host — use pgbouncer on :5433 for desktop tools.
    expose:
      - "5432"
    volumes:
      - covenant_pg_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covenant -d covenant"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Host-facing DB endpoint for desktop pgAdmin / psql / host Node.
  # Mounted ini (not edoburu AUTH_TYPE env): auth_type=any REQUIRES forced user=
  # on every [databases] line. edoburu only emits auth_user=, which yields
  # "bouncer config error" / auth_type=any requires forced user.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: covenant-pgbouncer
    volumes:
      - ./server/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./server/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "covenant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    container_name: covenant-sync-api
    working_dir: /app
    volumes:
      - ./server:/app
    environment:
      COVENANT_SYNC_DOCKER: "1"
      DATABASE_URL: postgres://covenant:covenant@postgres:5432/covenant
      PORT: "8787"
      CORS_ORIGIN: http://localhost:8000
      BOOTSTRAP_EMAIL: demo@covenant.local
      BOOTSTRAP_PASSWORD: covenant-demo
    ports:
      - "8787:8787"
    command: sh -c "npm install && node index.js"
    depends_on:
      postgres:
        condition: service_healthy

  # Browser pgAdmin — same Docker network as postgres (no host:5433).
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: covenant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@covenant.dev
      PGADMIN_DEFAULT_PASSWORD: covenant
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "5050:80"
    volumes:
      - ./server/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./server/pgadmin/pgpass:/tmp/pgpass:ro
    # Copy pgpass with mode 0600 (required by libpq; bind mounts from Windows often lack it).
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /tmp/pgpass /var/lib/pgadmin/pgpass
        chmod 600 /var/lib/pgadmin/pgpass
        chown pgadmin:root /var/lib/pgadmin/pgpass 2>/dev/null || true
        exec /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  covenant_pg_data:
