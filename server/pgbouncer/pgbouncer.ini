; LOCAL DEV ONLY — host-facing proxy for desktop pgAdmin / psql / host Node.
; Do not use auth_type=any without a forced user= (pgbouncer docs).
; edoburu’s DATABASE_URL generator emits auth_user= only, which breaks AUTH_TYPE=any.

[databases]
; Forced user/password required for auth_type=any. Backend Postgres uses trust.
covenant = host=postgres port=5432 dbname=covenant user=covenant password=covenant
* = host=postgres port=5432 user=covenant password=covenant

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = any
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
admin_users = covenant
ignore_startup_parameters = extra_float_digits,options
server_reset_query = DISCARD ALL
max_client_conn = 200
default_pool_size = 20
