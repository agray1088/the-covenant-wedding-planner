# LOCAL DEV ONLY — never use trust in production.
# Baked into the Covenant Postgres image (server/Dockerfile.postgres) and forced
# via hba_file= so host/proxy TCP never falls back to SCRAM from an old volume.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             0.0.0.0/0               trust
host    all             all             ::/0                    trust
