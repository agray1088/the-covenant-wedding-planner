<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning Timeline & Tasks — Covenant Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../redesign-tokens.css">
<link rel="stylesheet" href="../redesign-components.css">
<link rel="stylesheet" href="../redesign-shell.css">
<link rel="stylesheet" href="../redesign-layouts.css">
</head>
<body class="rd-scope" data-page="dashboard">
<div class="rd-shell">
  <!-- ═══ TOP BAR — preserve ids: onclick names match planner.js ═══ -->
  <header class="rd-topbar">
    <div class="rd-topbar__brand">
      <span class="rd-topbar__mark">&#10022;</span>
      <span class="rd-topbar__name">The Covenant Wedding Planner</span>
    </div>
    <button type="button" class="rd-topbar__wedding" onclick="openProfileSwitcher()">
      <span class="rd-topbar__avatar" id="profile-initials">AK</span>
      <span id="topbar-wedding-label">Ama &amp; Kwesi · 8 November 2026</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button type="button" class="rd-search" onclick="openCommandPalette()">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
      <span>Search the planner</span>
      <span class="rd-search__kbd">&#8984;K</span>
    </button>
    <div class="rd-topbar__right">
      <button type="button" class="rd-undo" id="undo-btn" onclick="undoLastChange()" title="Undo (⌘Z)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1 1.6 9"/></svg> Undo</button>
      <button type="button" class="rd-undo" id="redo-btn" onclick="redoLastChange()" title="Redo (⌘⇧Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M15 7h5V2"/><path d="M20 7a9 9 0 1 0-1.6 9"/></svg> Redo</button>
      <span class="rd-savestate" id="save-state">Saved</span>
      <button type="button" class="rd-topbar__bell" onclick="showPanel('dashboard')" aria-label="Alerts"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button type="button" class="rd-topbar__gear" onclick="openViewerPrefs()" aria-label="Viewer preferences"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
      <button type="button" class="rd-topbar__profile" onclick="openViewerPrefs()">MO</button>
    </div>
  </header>
  <nav class="rd-tabs" aria-label="Sections">
    <button type="button" class="rd-tab is-active" onclick="showPanel('dashboard')">Overview</button>
    <button type="button" class="rd-tab" onclick="showPanel('tasks')">Planning</button>
    <button type="button" class="rd-tab" onclick="showPanel('guests')">People</button>
    <button type="button" class="rd-tab" onclick="showPanel('budget')">Money</button>
    <button type="button" class="rd-tab" onclick="showPanel('vendors')">Vendors</button>
    <button type="button" class="rd-tab" onclick="showPanel('timeline')">The Day</button>
    <button type="button" class="rd-tab" onclick="showPanel('vision')" data-covenant="1"><span class="rd-tab__dot"></span>Covenant</button>
    <button type="button" class="rd-tab" onclick="showPanel('data-hub')">Documents</button>
  </nav>
  <nav class="rd-subnav" aria-label="Pages">
    <button type="button" class="rd-subnav__item is-active" onclick="showPanel('dashboard')">Dashboard</button>
    <button type="button" class="rd-subnav__item" onclick="showPanel('notes')">Notes</button>
  </nav>
  <div class="rd-body">
    <aside class="rd-rail">
      <div>
        <div class="rd-rail__title">Jump to</div>
        <div class="rd-rail__list">
          <button type="button" class="rd-rail__item is-active">Countdown<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">What needs you<span class="rd-rail__count rd-rail__count--warn">6</span></button>
          <button type="button" class="rd-rail__item">Money<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">The day<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">Covenant<span class="rd-rail__count"></span></button>
        </div>
      </div>
      <div>
        <div class="rd-rail__title">At a glance</div>
        <div class="rd-rail__meters">
          <div class="rd-rail__meter"><div class="rd-rail__meter-top"><span>Tasks complete</span><span class="rd-rail__count">23 of 59</span></div><div class="rd-progress"><div class="rd-progress__fill" style="width:39%"></div></div></div>
          <div class="rd-rail__meter"><div class="rd-rail__meter-top"><span>Budget used</span><span class="rd-rail__count">$23,040</span></div><div class="rd-progress"><div class="rd-progress__fill" style="width:77%"></div></div></div>
          <div class="rd-rail__meter"><div class="rd-rail__meter-top"><span>RSVPs in</span><span class="rd-rail__count">129 of 142</span></div><div class="rd-progress"><div class="rd-progress__fill" style="width:91%"></div></div></div>
          <div class="rd-rail__meter-top"><span>Days to go</span><span class="rd-rail__count">99</span></div>
        </div>
      </div>
      <div>
        <div class="rd-rail__title">Shortcuts</div>
        <div class="rd-rail__list">
          <button type="button" class="rd-rail__item">Add a task<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">Log a payment<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">Record an RSVP<span class="rd-rail__count"></span></button>
        </div>
      </div>
    </aside>
    <main class="rd-main" id="panel-dashboard" data-panel="dashboard">
      <div class="rd-pagehead">
        <div>
          <div class="rd-pagehead__eyebrow">Overview</div>
          <h1 class="rd-pagehead__title">Dashboard</h1>
        </div>
        <div class="rd-pagehead__actions">
          <button type="button" class="rd-btn" onclick="window.print()">Print section</button>
          <button type="button" class="rd-btn" onclick="downloadBackup()">Download backup</button>
          <button type="button" class="rd-btn rd-btn--primary" onclick="openDataHub()">Open Database Hub</button>
        </div>
      </div>
      <div class="rd-stats m-stats" id="dash-stats"></div>
      <div class="rd-surface">
        <div class="rd-panel m-block" id="dash-banner-editor"></div>
        <div class="rd-grid-3">
          <section class="rd-panel m-block"><div class="rd-panel__head m-head">What needs you</div><div id="dash-alerts"></div></section>
          <section class="rd-panel m-block"><div class="rd-panel__head m-head">Next up</div><div id="dash-upcoming"></div></section>
          <section class="rd-panel m-block"><div class="rd-panel__head m-head">Money</div><div id="dash-budget"></div></section>
        </div>
        <section class="rd-panel m-block"><div class="rd-panel__head m-head">The day</div><div id="dash-timeline" class="wday-vertical"></div></section>
      </div>
    </main>
  </div>
  </div>
<!-- The planner's own scripts. Load order matches index.html. -->
<script src="../autofit-columns.js"></script>
<script src="../../js/planner.js"></script>
<script src="../../js/planner-pill-scheme.js"></script>
<script src="../../js/ux-kit.js"></script>
</body>
</html>
