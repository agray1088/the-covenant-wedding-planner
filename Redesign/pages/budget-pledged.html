<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget · Pledged &amp; paid — Covenant Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../redesign-tokens.css">
<link rel="stylesheet" href="../redesign-components.css">
<link rel="stylesheet" href="../redesign-shell.css">
<link rel="stylesheet" href="../redesign-layouts.css">
</head>
<body class="rd-scope" data-page="budget">
<div class="rd-shell">
  <!-- ═══ TOP BAR — preserve ids: onclick names match planner.js ═══ -->
  <header class="rd-topbar">
    <div class="rd-topbar__brand">
      <span class="rd-topbar__mark">&#10022;</span>
      <span class="rd-topbar__name">The Covenant Wedding Planner</span>
    </div>
    <button type="button" class="rd-topbar__wedding" onclick="openProfileSwitcher()">
      <span class="rd-topbar__avatar" id="profile-initials">AK</span>
      <span id="topbar-wedding-label">Ama &amp; Kwesi · 8 November 2026</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button type="button" class="rd-search" onclick="openCommandPalette()">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
      <span>Search the planner</span>
      <span class="rd-search__kbd">&#8984;K</span>
    </button>
    <div class="rd-topbar__right">
      <button type="button" class="rd-undo" id="undo-btn" onclick="undoLastChange()" title="Undo (⌘Z)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1 1.6 9"/></svg> Undo</button>
      <button type="button" class="rd-undo" id="redo-btn" onclick="redoLastChange()" title="Redo (⌘⇧Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M15 7h5V2"/><path d="M20 7a9 9 0 1 0-1.6 9"/></svg> Redo</button>
      <span class="rd-savestate" id="save-state">Saved</span>
      <button type="button" class="rd-topbar__bell" onclick="showPanel('dashboard')" aria-label="Alerts"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button type="button" class="rd-topbar__gear" onclick="openViewerPrefs()" aria-label="Viewer preferences"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
      <button type="button" class="rd-topbar__profile" onclick="openViewerPrefs()">MO</button>
    </div>
  </header>
  <nav class="rd-tabs" aria-label="Sections">
    <button type="button" class="rd-tab" onclick="showPanel('dashboard')">Overview</button>
    <button type="button" class="rd-tab" onclick="showPanel('tasks')">Planning</button>
    <button type="button" class="rd-tab" onclick="showPanel('guests')">People</button>
    <button type="button" class="rd-tab is-active" onclick="showPanel('budget')">Money</button>
    <button type="button" class="rd-tab" onclick="showPanel('vendors')">Vendors</button>
    <button type="button" class="rd-tab" onclick="showPanel('timeline')">The Day</button>
    <button type="button" class="rd-tab" onclick="showPanel('vision')" data-covenant="1"><span class="rd-tab__dot"></span>Covenant</button>
    <button type="button" class="rd-tab" onclick="showPanel('data-hub')">Documents</button>
  </nav>
  <nav class="rd-subnav" aria-label="Pages">
    <button type="button" class="rd-subnav__item is-active" onclick="showPanel('budget')">Budget</button>
    <button type="button" class="rd-subnav__item" onclick="showPanel('payments')">Payments</button>
    <button type="button" class="rd-subnav__item" onclick="showPanel('contracts')">Contracts &amp; Invoices</button>
  </nav>
  <div class="rd-body">
    <aside class="rd-rail">
      <div>
        <div class="rd-rail__title">Views<button type="button" class="rd-rail__add" onclick="saveBudgetView()">+</button></div>
        <div class="rd-rail__list">
          <button type="button" class="rd-rail__item is-active">All categories<span class="rd-rail__count">8</span></button>
          <button type="button" class="rd-rail__item">Over target<span class="rd-rail__count rd-rail__count--warn">2</span></button>
          <button type="button" class="rd-rail__item">Derived<span class="rd-rail__count">2</span></button>
          <button type="button" class="rd-rail__item">From a contract<span class="rd-rail__count">5</span></button>
          <button type="button" class="rd-rail__item">Unquoted<span class="rd-rail__count rd-rail__count--warn">1</span></button>
        </div>
      </div>
      <div>
        <div class="rd-rail__title">Against target</div>
        <div class="rd-rail__meters">
          <div class="rd-rail__meter"><div class="rd-rail__meter-top"><span>Committed</span><span class="rd-rail__count">$23,040</span></div><div class="rd-progress"><div class="rd-progress__fill" style="width:77%"></div></div></div>
          <div class="rd-rail__meter-top"><span>Paid</span><span class="rd-rail__count">$11,360</span></div>
          <div class="rd-rail__meter-top"><span>Outstanding</span><span class="rd-rail__count">$11,680</span></div>
          <div class="rd-rail__meter-top"><span>Target</span><span class="rd-rail__count">$30,000</span></div>
        </div>
      </div>
      <div>
        <div class="rd-rail__title">Group by</div>
        <div class="rd-rail__list">
          <button type="button" class="rd-rail__item is-active">Category<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">Vendor<span class="rd-rail__count"></span></button>
          <button type="button" class="rd-rail__item">Status<span class="rd-rail__count"></span></button>
        </div>
      </div>
      <p class="rd-rail__note">Needs a <b>"Not pledged" group</b> showing the shortfall — money committed with no source. A group, not a footnote.</p>
    </aside>
    <main class="rd-main" id="panel-budget-pledged" data-panel="budget" data-view="pledged">
      <div class="rd-pagehead">
        <div>
          <div class="rd-pagehead__eyebrow">Money</div>
          <h1 class="rd-pagehead__title">Budget</h1>
        </div>
        <div class="rd-pagehead__actions">
          <button type="button" class="rd-btn" onclick="openBudgetReconcile()">Reconcile</button>
          <button type="button" class="rd-btn" onclick="window.print()">Print section</button>
          <button type="button" class="rd-btn" onclick="exportSectionCSV('Budget',data.budget)">Export CSV</button>
          <button type="button" class="rd-btn rd-btn--primary" onclick="addBudgetRow()">+ Add line</button>
        </div>
      </div>
      <div class="rd-stats m-stats" id="budget-pledged-stats"></div>
      <div class="rd-toolbar">
        <button type="button" class="rd-chip">Category: all<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button" class="rd-chip">Status: all<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button" class="rd-chip">Source: all<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button" class="rd-chip rd-chip--ghost"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Sort by category</button>
        <div class="rd-toolbar__right">
          <button type="button" class="rd-chip"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><rect x="4" y="4" width="16" height="16"/><path d="M10 4v16M15 4v16"/></svg>Columns · 8 of 12<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg></button>
          <button type="button" class="rd-chip" onclick="autoFitColumns(this)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M3 5v14M21 5v14"/><path d="M7 12h10"/><path d="M10 9l-3 3 3 3M14 9l3 3-3 3"/></svg>Auto-fit columns</button>
          <button type="button" class="rd-chip"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Row height · compact<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="rd-viewswitch"><button type="button" class="rd-viewswitch__item">Itemized</button><button type="button" class="rd-viewswitch__item">By category</button><button type="button" class="rd-viewswitch__item is-active">Pledged &amp; paid</button></div>
        </div>
      </div>
      <div class="rd-bulkbar" id="bulk-bar" hidden>
        <span class="rd-bulkbar__count"><span data-bulk-count>0</span> selected</span>
        <span class="rd-bulkbar__sep"></span>
        <button type="button" class="rd-bulkbar__action">Set category</button>
        <button type="button" class="rd-bulkbar__action">Set vendor</button>
        <button type="button" class="rd-bulkbar__action">Mark paid</button>
        <button type="button" class="rd-bulkbar__action">Export selection</button>
        <button type="button" class="rd-bulkbar__action">Delete</button>
        <button type="button" class="rd-bulkbar__clear">Clear selection</button>
      </div>
      <div class="rd-surface">
        <!-- View mount per CURSOR-IMPLEMENTATION-GUIDE §8. Fill from the same records as the base view. -->
        <div class="rd-grouplist" id="budget-pledged-mount"></div>
        <span class="rd-table-foot ued-soft" id="budget-pledged-foot"></span>
      </div>
    </main>
    <aside class="rd-drawer" id="record-drawer" hidden></aside>
  </div>
  </div>
<!-- The planner's own scripts. Load order matches index.html. -->
<script src="../autofit-columns.js"></script>
<script src="../../js/planner.js"></script>
<script src="../../js/planner-pill-scheme.js"></script>
<script src="../../js/ux-kit.js"></script>
</body>
</html>
