# Railway — preferred concrete path for Node + managed Postgres + HTTPS.
# Docs: docs/HOSTED_DEPLOY.md
#
# In the Railway dashboard:
# 1. New Project → Deploy from GitHub (this repo)
# 2. Add Postgres plugin (injects DATABASE_URL)
# 3. Set root / watch paths so the API builds from server/
# 4. Set secrets from server/.env.production.example

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
