# Railway — preferred path for Node + managed Postgres + HTTPS.
# Full checklist: docs/HOSTED_DEPLOY.md
# Env template: server/.env.production.example
#
# Dashboard steps (you paste secrets — we cannot log into your Railway account):
# 1. New Project → Deploy from GitHub (this repo)
# 2. Add Postgres → link to this service (injects DATABASE_URL)
# 3. Variables → set every required secret below, then redeploy
# 4. Copy the public HTTPS URL → PUBLIC_URL (no trailing slash)
# 5. curl https://$PUBLIC_URL/health and /setup/status
# 6. Planner Settings → Cloud sync → set API base to that PUBLIC_URL
#
# Optional single-service UI+API: dockerfilePath = "Dockerfile.hosted" + SERVE_STATIC=1
#
# --- Required Variables (Railway dashboard) ---
#   DATABASE_URL          # from linked Postgres
#   DATABASE_SSL=1
#   PUBLIC_URL            # https://<service>.up.railway.app  (no trailing slash)
#   CORS_ORIGIN           # planner origin(s), comma-separated
#   SESSION_SECRET        # openssl rand -hex 32
#   TRUST_PROXY=1
# --- Recommended ---
#   CLIENT_APP_URL        # Google return origin (defaults to first CORS_ORIGIN)
# --- Google Sign-In (AUTH.md) ---
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REDIRECT_URI   # optional; default ${PUBLIC_URL}/auth/google/callback
# --- SMTP (RSVP + auth email) ---
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
#   SMTP_SECURE           # 0 for 587, 1 for 465
# --- Optional PHOTO_STORAGE R2/S3 (BACKUP_AND_PHOTOS.md) ---
#   PHOTO_STORAGE=s3|r2
#   S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_PUBLIC_BASE_URL
#   — or —
#   R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_PUBLIC_BASE_URL
# --- Do NOT set on public multi-tenant prod ---
#   BOOTSTRAP_EMAIL / BOOTSTRAP_PASSWORD

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
