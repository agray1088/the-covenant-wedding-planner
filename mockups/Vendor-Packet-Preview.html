/* Measured height of an element including its vertical margins. */
function _cvpBlockH(el){
  const r = el.getBoundingClientRect();
  const cs = getComputedStyle(el);
  return r.height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
}
function _cvpIsHeading(el){
  return el.classList && (el.classList.contains('cvp-sec') || el.classList.contains('cvp-phasehead') || el.classList.contains('cvp-q'));
}
/* Content-height budget for one physical 8.5x11 sheet (page minus masthead,
   footer, and paddings). Uses CSS pixels: 11in = 1056px. */
function _cvpSheetBudget(sheet){
  const cs = getComputedStyle(sheet);
  const body = sheet.querySelector('.cvp-body');
  const mast = sheet.querySelector('.cvp-mast');
  const foot = sheet.querySelector('.cvp-foot');
  const mastH = mast ? mast.getBoundingClientRect().height : 0;
  const footH = foot ? foot.getBoundingClientRect().height : 0;
  const bcs = body ? getComputedStyle(body) : null;
  const pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  const bpad = bcs ? ((parseFloat(bcs.paddingTop) || 0) + (parseFloat(bcs.paddingBottom) || 0)) : 0;
  return 1056 - pad - mastH - footH - bpad - 8;
}
/* Reflow each logical builder page into real 8.5x11 sheets: repeat the
   masthead + footer per sheet, split long tables (repeating their header),
   and keep section headings with the content that follows. */
function cvpPaginate(container){
  try {
    const sources = Array.prototype.slice.call(container.querySelectorAll(':scope > main.cvp-page'));
    if (!sources.length) return;
    sources.forEach(src => {
      const mast = src.querySelector('.cvp-mast');
      const foot = src.querySelector('.cvp-foot');
      const bodyEl = src.querySelector('.cvp-body');
      const blocks = bodyEl ? Array.prototype.slice.call(bodyEl.children) : [];
      const ctx = { sheet: null, body: null, used: 0, budget: 0 };
      const newSheet = () => {
        ctx.sheet = document.createElement('main');
        ctx.sheet.className = 'cvp-page';
        if (mast) ctx.sheet.appendChild(mast.cloneNode(true));
        ctx.body = document.createElement('section');
        ctx.body.className = 'cvp-body';
        ctx.sheet.appendChild(ctx.body);
        if (foot) ctx.sheet.appendChild(foot.cloneNode(true));
        container.appendChild(ctx.sheet);   // append live so it can be measured
        ctx.used = 0;
        ctx.budget = _cvpSheetBudget(ctx.sheet);
      };
      newSheet();
      let guard = 0;
      blocks.forEach(block => {
        if (guard++ > 5000) return;
        if (getComputedStyle(block).display === 'none') return;  // skip hidden (Summary mode)
        if (block.tagName === 'TABLE') { _cvpPlaceTable(block, ctx, newSheet); return; }
        ctx.body.appendChild(block);
        const h = _cvpBlockH(block);
        // avoid orphaned headings near the bottom of a sheet
        if (_cvpIsHeading(block) && ctx.used > 0 && (ctx.budget - ctx.used) < h + 70) {
          ctx.body.removeChild(block); newSheet(); ctx.body.appendChild(block); ctx.used = _cvpBlockH(block); return;
        }
        if (ctx.used + h <= ctx.budget) { ctx.used += h; return; }
        if (ctx.used > 0) { ctx.body.removeChild(block); newSheet(); ctx.body.appendChild(block); ctx.used = _cvpBlockH(block); }
        else { ctx.used += h; } // single block taller than a page: accept
      });
    });
    // remove the original logical pages, leaving the paginated sheets
    sources.forEach(s => s.remove());
  } catch (err) {
    if (typeof console !== 'undefined') console.error('cvpPaginate failed:', err);
  }
}
/* Place a table into the current sheet, spilling extra rows onto new sheets
   with the header row repeated. */
function _cvpPlaceTable(table, ctx, newSheet){
  const thead = table.querySelector('thead');
  const tbody = table.querySelector('tbody');
  const rows = tbody ? Array.prototype.slice.call(tbody.children) : [];
  const shell = () => {
    const t = table.cloneNode(false);
    if (thead) t.appendChild(thead.cloneNode(true));
    const tb = document.createElement('tbody');
    t.appendChild(tb);
    return { t: t, tb: tb };
  };
  let s = shell();
  ctx.body.appendChild(s.t);
  ctx.used += _cvpBlockH(s.t); // header height
  let guard = 0;
  rows.forEach(row => {
    if (guard++ > 20000) return;
    s.tb.appendChild(row);
    const rh = _cvpBlockH(row);
    if (ctx.used + rh <= ctx.budget) { ctx.used += rh; return; }
    s.tb.removeChild(row);
    newSheet();
    s = shell();
    ctx.body.appendChild(s.t);
    ctx.used += _cvpBlockH(s.t);
    s.tb.appendChild(row);
    ctx.used += _cvpBlockH(row);
  });
}

function openCovenantPrintTemplate(sheetsHtml){
  const rootId = 'cvp-root';
  const old = document.getElementById(rootId); if (old) old.remove();
  const oldStyle = document.getElementById(rootId + '-style'); if (oldStyle) oldStyle.remove();
  const style = document.createElement('style');
  style.id = rootId + '-style';
  style.textContent = COVENANT_PRINT_CSS;
  document.head.appendChild(style);
  const root = document.createElement('div');
  root.id = rootId;
  root.className = 'skin-letterhead';  // default style
  const source = sheetsHtml || '';
  root.innerHTML = '<div class="cvp-toolbar no-print"><button type="button" data-cvp-style>Style: Letterhead</button><button type="button" data-cvp-details>View: Summary</button><button type="button" data-cvp-print>Print</button><button type="button" data-cvp-close>Close</button></div><div class="cvp-pages"></div>';
  document.body.classList.add('cvp-printing');
  document.body.appendChild(root);
  const pagesEl = root.querySelector('.cvp-pages');
  const render = () => { pagesEl.innerHTML = source; cvpPaginate(pagesEl); };
  render();
  const detailsBtn = root.querySelector('[data-cvp-details]');
  detailsBtn.addEventListener('click', () => {
    const on = root.classList.toggle('cvp-details');
    detailsBtn.textContent = 'View: ' + (on ? 'Full details' : 'Summary');
    render();               // re-paginate: details add/remove content
    root.scrollTop = 0;
  });
  const close = () => {
    root.remove(); style.remove();
    document.body.classList.remove('cvp-printing');
    window.removeEventListener('afterprint', close);
  };
  const styleBtn = root.querySelector('[data-cvp-style]');
  styleBtn.addEventListener('click', () => {
    const keepsake = root.classList.toggle('skin-keepsake');
    root.classList.toggle('skin-letterhead', !keepsake);
    styleBtn.textContent = 'Style: ' + (keepsake ? 'Keepsake' : 'Letterhead');
    render();               // re-paginate: sheet heights differ per skin
    root.scrollTop = 0;
  });
  root.querySelector('[data-cvp-close]').addEventListener('click', close);
  root.querySelector('[data-cvp-print]').addEventListener('click', () => window.print());
  window.addEventListener('afterprint', close);
  /* No auto-print: the preview opens first so the couple can pick a style. */
  root.scrollTop = 0;
  return root;
}

/* Value helpers for Covenant print builders. */
function _cvpStr(v){ return (v == null ? '' : String(v)).trim(); }
function _cvpMultiline(v){ return escapeHtml(_cvpStr(v)).replace(/\n/g, '<br>'); }
/* A filled value as a paragraph, or N blank ruled lines to write on. */
function _cvpOrLines(v, n){
  const t = _cvpStr(v);
  if (t) return '<p class="cvp-p">' + _cvpMultiline(t) + '</p>';
  let s = ''; for (let i = 0; i < (n || 2); i++) s += '<div class="cvp-writeline"></div>';
  return s;
}
/* Inline value or a short write-on blank (used in the priority rows). */
function _cvpInline(v){
  const t = _cvpStr(v);
  return t ? escapeHtml(t) : '<span class="cvp-blank">&nbsp;</span>';
}

/* Short date like "Feb 15" for print tables; falls back to raw text. */
function _cvpShortDate(v){
  const t = _cvpStr(v); if (!t) return '';
  const d = new Date(t.length <= 10 ? t + 'T00:00:00' : t);
  return isNaN(d.getTime()) ? escapeHtml(t) : d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
/* Status pill colour class from free-text status. */
function _cvpStatusClass(s){
  const t = _cvpStr(s).toLowerCase();
  /* negatives first so they don't match the positive substrings (paid/booked/signed) */
  if (/unpaid|not paid|overdue|not signed|unsigned|not booked|not started|declin|regret/.test(t)) return 'waiting';
  if (/yes|accept|attend|going|confirm|\bpaid\b|complete|answer|done|booked|received|signed|order|included/.test(t)) return 'done';
  if (/partial|deposit|progress|praying|maybe|waitlist|tentative|tasting|trial|fitting/.test(t)) return 'praying';
  if (/pending|scheduled|waiting|wait|schedul|next|upcoming|owe|due\b|idea|research/.test(t)) return 'waiting';
  return '';
}
function _cvpPill(s){
  const t = _cvpStr(s); if (!t) return '';
  return '<span class="cvp-status ' + _cvpStatusClass(t) + '">' + escapeHtml(t) + '</span>';
}

/* Builder — Budget (Finances). Reads data.budget (+ items) and data.setup. */
function buildBudgetPrintSheets(){
  const s = (data && data.setup) || {};
  const cats = (typeof safeArray === 'function') ? safeArray(data && data.budget) : ((data && data.budget) || []);
  const couple = [s.bride, s.groom].filter(Boolean).join(' & ');
  const dateStr = pvDate(s.date) || _cvpStr(s.date);
  const crest = '&#9670;', orn = '&#10086;';
  const num = (typeof _cNum === 'function') ? _cNum : (v => parseFloat(v) || 0);
  const money = (typeof pvMoney === 'function') ? pvMoney : (v => '$' + Math.round(num(v)).toLocaleString('en-US'));
  const today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  const va = (typeof computeBudgetVariance === 'function')
    ? computeBudgetVariance()
    : { categories: [], totalPlanned: 0, totalActual: 0, totalVariance: 0, totalBudget: num(s.budget) };
  const overall = num(s.budget) || num(va.totalBudget) || 0;
  const remaining = overall - num(va.totalActual);

  const varCell = (planned, actual) => {
    const v = num(planned) - num(actual); const neg = v < 0;
    return '<td class="money' + (neg ? ' neg' : '') + '">' + (neg ? '&minus;' : '') + money(Math.abs(v)) + '</td>';
  };
  const catRows = (va.categories || []).map(c =>
    '<tr><td class="strong">' + escapeHtml(_cvpStr(c.cat)) + '</td>'
    + '<td class="money">' + money(c.planned) + '</td>'
    + '<td class="money">' + money(c.actual) + '</td>'
    + varCell(c.planned, c.actual) + '</tr>'
  ).join('') || '<tr><td colspan="4" class="cvp-empty">No budget categories yet.</td></tr>';
  const totalsRow = (va.categories && va.categories.length)
    ? '<tr class="cvp-tot"><td>Total</td><td class="money">' + money(va.totalPlanned) + '</td><td class="money">' + money(va.totalActual) + '</td>' + varCell(va.totalPlanned, va.totalActual) + '</tr>'
    : '';

  let itemRows = '';
  (cats || []).forEach(cat => {
    const items = (typeof safeArray === 'function') ? safeArray(cat.items) : (cat.items || []);
    if (!items.length) return;
    itemRows += '<tr class="cvp-catrow"><td colspan="4">' + escapeHtml(_cvpStr(cat.cat) || '(uncategorized)') + '</td></tr>';
    items.forEach(it => {
      const budg = (typeof itemBudgeted === 'function') ? itemBudgeted(it) : (num(it.budgeted) || num(it.cost));
      const st = _cvpStr(it.status) || (it.paid ? 'Paid' : '');
      itemRows += '<tr><td>' + escapeHtml(_cvpStr(it.name)) + '</td>'
        + '<td class="money">' + money(budg) + '</td>'
        + '<td class="money">' + money(it.actual) + '</td>'
        + '<td>' + (st ? _cvpPill(st) : '') + '</td></tr>';
    });
  });
  if (!itemRows) itemRows = '<tr><td colspan="4" class="cvp-empty">No line items yet.</td></tr>';

  const sheet1 = ''
    + '<main class="cvp-page">'
    +   '<header class="cvp-mast"><div class="cvp-crest">' + crest + '</div>'
    +     '<div class="cvp-eyebrow">Finances &middot; Essentials Collection</div>'
    +     '<h1 class="cvp-title">Budget</h1>'
    +     '<p class="cvp-subtitle">Planned versus actual spending across every category</p>'
    +     '<div class="cvp-rule"><span>' + orn + '</span></div></header>'
    +   '<section class="cvp-body">'
    +     '<span class="cvp-sec">Overview</span>'
    +     '<div class="cvp-info">'
    +       '<div><div class="cvp-flabel">Couple</div><div class="cvp-fval">' + (_cvpStr(couple) ? escapeHtml(couple) : '&nbsp;') + '</div></div>'
    +       '<div><div class="cvp-flabel">Wedding date</div><div class="cvp-fval">' + (dateStr ? escapeHtml(dateStr) : '&nbsp;') + '</div></div>'
    +       '<div><div class="cvp-flabel">Total budget</div><div class="cvp-fval">' + money(overall) + '</div></div>'
    +       '<div><div class="cvp-flabel">Prepared</div><div class="cvp-fval">' + escapeHtml(today) + '</div></div>'
    +     '</div>'
    +     '<span class="cvp-sec">Where the money stands</span>'
    +     '<div class="cvp-stats">'
    +       '<div class="cvp-stat"><div class="cvp-stat-label">Total budget</div><div class="cvp-stat-value">' + money(overall) + '</div></div>'
    +       '<div class="cvp-stat gold"><div class="cvp-stat-label">Planned</div><div class="cvp-stat-value">' + money(va.totalPlanned) + '</div></div>'
    +       '<div class="cvp-stat mauve"><div class="cvp-stat-label">Actual spend</div><div class="cvp-stat-value">' + money(va.totalActual) + '</div></div>'
    +       '<div class="cvp-stat ' + (remaining < 0 ? 'burg' : '') + '"><div class="cvp-stat-label">' + (remaining < 0 ? 'Over budget' : 'Remaining') + '</div><div class="cvp-stat-value">' + money(Math.abs(remaining)) + '</div></div>'
    +     '</div>'
    +     '<span class="cvp-sec">Category summary</span>'
    +     '<table class="cvp-table"><thead><tr><th>Category</th><th class="money">Planned</th><th class="money">Actual</th><th class="money">Variance</th></tr></thead><tbody>' + catRows + totalsRow + '</tbody></table>'
    +   '</section>'
    +   '<footer class="cvp-foot"><div class="fb">The Covenant Wedding Planner</div><div class="fv">Commit thy works unto the Lord, and thy thoughts shall be established. &middot; Budget, Page 1</div></footer>'
    + '</main>';

  const sheet2 = ''
    + '<main class="cvp-page">'
    +   '<header class="cvp-mast"><div class="cvp-crest">' + crest + '</div>'
    +     '<div class="cvp-eyebrow">Budget &middot; Itemized</div>'
    +     '<h1 class="cvp-title">Line Items</h1>'
    +     '<p class="cvp-subtitle">Every budgeted line, grouped by category</p>'
    +     '<div class="cvp-rule"><span>' + orn + '</span></div></header>'
    +   '<section class="cvp-body">'
    +     '<span class="cvp-sec">Itemized budget</span>'
    +     '<table class="cvp-table"><thead><tr><th>Item</th><th class="money">Budgeted</th><th class="money">Actual</th><th>Status</th></tr></thead><tbody>' + itemRows + '</tbody></table>'
    +     _cvpBudgetDetails(cats)
    +   '</section>'
    +   '<footer class="cvp-foot"><div class="fb">The Covenant Wedding Planner</div><div class="fv">A faithful steward plans with wisdom. &middot; Budget, Page 2</div></footer>'
    + '</main>';

  return sheet1 + sheet2;
}

/* Builder — Guest List (People). Reads data.guests + meal counts. */
function buildGuestListPrintSheets(){
  const s = (data && data.setup) || {};
  const guests = (typeof safeArray === 'function') ? safeArray(data && data.guests) : ((data && data.guests) || []);
  const couple = [s.bride, s.groom].filter(Boolean).join(' & ');
  const dateStr = pvDate(s.date) || _cvpStr(s.date);
  const crest = '&#9670;', orn = '&#10086;';
  const declined = g => /^(no|declined|regret)/i.test(_cvpStr(g.rsvp));
  const isYes = g => /^(yes|accept)/i.test(_cvpStr(g.rsvp));
  const isPending = (typeof guestRsvpPending === 'function') ? guestRsvpPending : (g => { const r = _cvpStr(g.rsvp); return !r || /pending/i.test(r); });

  const totalRows = guests.length;
  const yes = guests.filter(isYes).length;
  const pending = guests.filter(isPending).length;
  const decl = guests.filter(declined).length;
  const meals = (typeof computeMealCounts === 'function') ? computeMealCounts() : { meals: [], total: yes };
  const headcount = meals.total || yes;

  const mealRows = (meals.meals || []).filter(m => m.count).map(m =>
    '<tr><td class="strong">' + escapeHtml(_cvpStr(m.meal)) + '</td><td class="money">' + m.count + '</td></tr>'
  ).join('') || '<tr><td colspan="2" class="cvp-empty">No meal selections yet.</td></tr>';

  const tableLabelOf = t => {
    const v = _cvpStr(t); if (!v) return '';
    return (typeof tableLabel === 'function') ? escapeHtml(_cvpStr(tableLabel(t))) : escapeHtml(v);
  };
  /* Party size = the guest + their companions (or plus-one + children). */
  const partySize = g => {
    const comps = Array.isArray(g.companions) ? g.companions : [];
    const extra = comps.length ? comps.length : ((g.plusone ? 1 : 0) + (parseInt(g.children, 10) || 0));
    return 1 + extra;
  };
  let totalParty = 0;
  const rosterRows = guests.slice().sort((a, b) => _cvpStr(a.name).localeCompare(_cvpStr(b.name))).map(g => {
    const ps = partySize(g); totalParty += ps;
    return '<tr><td class="strong">' + escapeHtml(_cvpStr(g.name)) + '</td>'
    + '<td class="money">' + ps + '</td>'
    + '<td>' + escapeHtml(_cvpStr(g.side)) + '</td>'
    + '<td>' + (_cvpStr(g.rsvp) ? _cvpPill(g.rsvp) : '') + '</td>'
    + '<td>' + escapeHtml(_cvpStr(g.meal)) + '</td>'
    + '<td>' + tableLabelOf(g.table) + '</td></tr>';
  }).join('') || '<tr><td colspan="6" class="cvp-empty">No guests added yet.</td></tr>';
  const rosterTotal = guests.length
    ? '<tr class="cvp-tot"><td>Total party</td><td class="money">' + totalParty + '</td><td colspan="4"></td></tr>'
    : '';

  const sheet1 = ''
    + '<main class="cvp-page">'
    +   '<header class="cvp-mast"><div class="cvp-crest">' + crest + '</div>'
    +     '<div class="cvp-eyebrow">People &middot; Essentials Collection</div>'
    +     '<h1 class="cvp-title">Guest List</h1>'
    +     '<p class="cvp-subtitle">RSVPs, meal counts, and seating at a glance</p>'
    +     '<div class="cvp-rule"><span>' + orn + '</span></div></header>'
    +   '<section class="cvp-body">'
    +     '<span class="cvp-sec">Overview</span>'
    +     '<div class="cvp-info">'
    +       '<div><div class="cvp-flabel">Couple</div><div class="cvp-fval">' + (_cvpStr(couple) ? escapeHtml(couple) : '&nbsp;') + '</div></div>'
    +       '<div><div class="cvp-flabel">Wedding date</div><div class="cvp-fval">' + (dateStr ? escapeHtml(dateStr) : '&nbsp;') + '</div></div>'
    +       '<div><div class="cvp-flabel">Households / invites</div><div class="cvp-fval">' + totalRows + '</div></div>'
    +       '<div><div class="cvp-flabel">Attending headcount</div><div class="cvp-fval">' + headcount + '</div></div>'
    +     '</div>'
    +     '<span class="cvp-sec">RSVP status</span>'
    +     '<div class="cvp-stats">'
    +       '<div class="cvp-stat"><div class="cvp-stat-label">On the list</div><div class="cvp-stat-value">' + totalRows + '</div></div>'
    +       '<div class="cvp-stat gold"><div class="cvp-stat-label">Attending</div><div class="cvp-stat-value">' + yes + '</div></div>'
    +       '<div class="cvp-stat mauve"><div class="cvp-stat-label">Pending</div><div class="cvp-stat-value">' + pending + '</div></div>'
    +       '<div class="cvp-stat burg"><div class="cvp-stat-label">Declined</div><div class="cvp-stat-value">' + decl + '</div></div>'
    +     '</div>'
    +     '<span class="cvp-sec">Meal counts</span>'
    +     '<table class="cvp-table"><thead><tr><th>Meal selection</th><th class="money">Count</th></tr></thead><tbody>' + mealRows + '</tbody></table>'
    +   '</section>'
    +   '<footer class="cvp-foot"><div class="fb">The Covenant Wedding Planner</div><div class="fv">Given to hospitality. &middot; Guest List, Page 1</div></footer>'
    + '</main>';

  const sheet2 = ''
    + '<main class="cvp-page">'
    +   '<header class="cvp-mast"><div class="cvp-crest">' + crest + '</div>'
    +     '<div class="cvp-eyebrow">Guest List &middot; Roster</div>'
    +     '<h1 class="cvp-title">Guest Roster</h1>'
    +     '<p class="cvp-subtitle">Every guest with RSVP, meal, and table</p>'
    +     '<div class="cvp-rule"><span>' + orn + '</span></div></header>'
    +   '<section class="cvp-body">'
    +     '<span class="cvp-sec">All guests</span>'
    +     '<table class="cvp-table"><thead><tr><th>Guest</th><th class="money">Party</th><th>Side</th><th>RSVP</th><th>Meal</th><th>Table</th></tr></thead><tbody>' + rosterRows + rosterTotal + '</tbody></table>'
    +     _cvpGuestDetails(guests)
    +   '</section>'
    +   '<footer class="cvp-foot"><div class="fb">The Covenant Wedding Planner</div><div class="fv">Every name matters. &middot; Guest List, Page 2</div></footer>'
    + '</main>';

  return sheet1 + sheet2;
}

/* Shared masthead + overview helpers for the single-sheet table templates. */
function _cvpEyebrow(eyebrow){
  /* Drop the brand prefix (the brand now sits in the right-hand meta) and
     frame the left eyebrow as "[Section] · Essentials Collection". */
  var eb = String(eyebrow == null ? '' : eyebrow).replace(/^\s*The Covenant Wedding Planner\s*(?:&middot;|·)\s*/i, '').trim();
  return eb ? (eb + ' &middot; Essentials Collection') : 'Essentials Collection';
