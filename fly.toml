# Fly.io — alternate hosted path for the Covenant sync API.
# Full checklist: docs/HOSTED_DEPLOY.md
# Env template: server/.env.production.example
#
# App name below is a placeholder — change before first `fly launch` / `fly deploy`.
# Secrets: use `fly secrets set` or the Fly dashboard. NEVER put real secrets in this file.
#
# Quick path:
#   fly apps create <name>
#   fly postgres create && fly postgres attach <pg-app>
#   fly secrets set SESSION_SECRET=… PUBLIC_URL=… CORS_ORIGIN=… DATABASE_SSL=1 TRUST_PROXY=1 \
#     GOOGLE_CLIENT_ID=… GOOGLE_CLIENT_SECRET=… \
#     SMTP_HOST=… SMTP_PORT=587 SMTP_USER=… SMTP_PASS=… SMTP_FROM=…
#     # optional: PHOTO_STORAGE=r2 R2_BUCKET=… R2_ACCESS_KEY_ID=… R2_SECRET_ACCESS_KEY=… \
#     #           R2_ENDPOINT=… R2_PUBLIC_BASE_URL=…
#   fly deploy
#   curl https://$PUBLIC_URL/health && curl https://$PUBLIC_URL/setup/status
#
# --- Required secrets (fly secrets set) ---
#   DATABASE_URL          # usually from `fly postgres attach`
#   DATABASE_SSL=1        # also set in [env] below as default
#   PUBLIC_URL            # https://<app>.fly.dev  (no trailing slash)
#   CORS_ORIGIN
#   SESSION_SECRET
#   TRUST_PROXY=1
# --- Recommended ---
#   CLIENT_APP_URL
# --- Google ---
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET [, GOOGLE_REDIRECT_URI]
# --- SMTP ---
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM [, SMTP_SECURE]
# --- Optional R2/S3 ---
#   PHOTO_STORAGE + S3_* or R2_* + public base URL

app = "covenant-sync-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

# Non-secret defaults only. Real secrets → `fly secrets set`.
[env]
  NODE_ENV = "production"
  PORT = "8787"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"
  DATABASE_SSL = "1"
  SERVE_STATIC = "0"
  FEATURE_GOOGLE_AUTH = "0"
  FEATURE_EMAIL = "0"
  FEATURE_RSVP = "0"
  FEATURE_LANDING = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
