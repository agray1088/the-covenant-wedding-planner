# Fly.io config for the Covenant sync API.
# Deploy steps: docs/HOSTED_DEPLOY.md (Fly section).
# App name is a placeholder — change before first `fly launch` / `fly deploy`.

app = "covenant-sync-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"
  DATABASE_SSL = "1"
  SERVE_STATIC = "0"
  FEATURE_GOOGLE_AUTH = "0"
  FEATURE_EMAIL = "0"
  FEATURE_RSVP = "0"
  FEATURE_LANDING = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
